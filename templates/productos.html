{% extends "layout.html" %}

{% block content %}
<div class="container-fluid">
  <h1>Productos</h1>
  <p>Estos son los productos que ofrecemos.</p>
</div>
<div id="carouselProductos" class="carousel slide product-carousel" data-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="{{ url_for('static', filename='img/productos/vela.jpg') }}" class="d-block" alt="Vela">
    </div>
    <div class="carousel-item">
      <img src="{{ url_for('static', filename='img/productos/pan-de-muerto.jpg') }}" class="d-block" alt="Pan de muerto">
    </div>
    <div class="carousel-item">
      <img src="{{ url_for('static', filename='img/productos/maceta.png') }}" class="d-block" alt="Maceta">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-target="#carouselProductos" data-slide="prev"
    aria-label="Producto anterior">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
  </button>
  <button class="carousel-control-next" type="button" data-target="#carouselProductos" data-slide="next"
    aria-label="Producto siguiente">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
  </button>
</div>
{% endblock %}
